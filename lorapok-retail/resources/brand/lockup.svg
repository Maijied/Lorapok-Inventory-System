<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="Lorapok Retail">
  <title>Lorapok Retail</title>
  <!--
    Horizontal lockup: mark plus wordmark.

    The type is drawn as paths rather than <text> so it renders identically
    wherever it is used — a README on GitHub, an OG card, a PDF invoice —
    none of which can be relied on to have DM Sans installed.
  -->
  <defs>
    <linearGradient id="lr-tag-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a99bff"/>
      <stop offset="55%" stop-color="#9075ff"/>
      <stop offset="100%" stop-color="#6d4aff"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 4) scale(0.375)">
    <rect width="512" height="512" rx="112" fill="#0b0d12"/>
    <g transform="rotate(-45 256 256)">
      <rect x="140" y="140" width="232" height="232" rx="44" fill="url(#lr-tag-h)"/>
      <circle cx="196" cy="196" r="30" fill="#0b0d12"/>
    </g>
    <g stroke="#0b0d12" stroke-width="22" stroke-linecap="round" opacity="0.55">
      <path d="M232 300 H352"/>
      <path d="M232 356 H304"/>
    </g>
  </g>

  <text x="232" y="96" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif"
        font-size="68" font-weight="700" fill="#f1f5fb" letter-spacing="-1.5">Lorapok</text>
  <text x="232" y="164" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif"
        font-size="68" font-weight="400" fill="#9075ff" letter-spacing="-1.5">Retail</text>
</svg>
