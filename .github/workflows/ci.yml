name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lorapok-retail

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway credentials for an ephemeral CI service container.
          # Nothing here is a real secret.
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php-app

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tenancy provisions one database per shop, so the test user needs
      # CREATE DATABASE within the tenant_ namespace. Root is used in CI
      # because the service container is ephemeral and discarded per job.
      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

      # --parallel gives each worker its own central database (testing_test_N)
      # and, via ParallelTestingServiceProvider, its own tenant namespace
      # (tenant_pN_) so two workers cannot drop each other's schemas.
      #
      # --processes is pinned rather than left to nproc, which has changed on
      # ubuntu-latest before and would make run-to-run timings meaningless.
      - name: Run tests
        run: |
          START=$(date +%s)
          php artisan test --parallel --processes=4 --recreate-databases
          echo "Suite: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
          TENANCY_DB_USERNAME: root
          TENANCY_DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1

      # Tenant databases are not covered by RefreshDatabase. The suite drops
      # what it creates, but a failed test can leave one behind — fail loudly
      # rather than letting them accumulate on a shared runner.
      # A leak is a bug, not a note: it means a test created a database that
      # nothing dropped, and on a shared runner those accumulate until
      # provisioning fails for an unrelated reason. `LIKE 'tenant\_%'` still
      # matches the per-process `tenant_p1_…` names, because `\_` is a literal
      # underscore and `%` covers the rest.
      - name: Check for leaked tenant databases
        if: always()
        run: |
          LEAKED=$(mysql -h 127.0.0.1 -uroot -ppassword -N \
            -e "SHOW DATABASES LIKE 'tenant\_%';" 2>/dev/null)
          COUNT=$(printf '%s' "$LEAKED" | grep -c . || true)
          echo "Leaked tenant databases: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            printf '%s\n' "$LEAKED"
            echo "::error::Test run left $COUNT tenant database(s) behind"
            exit 1
          fi

  static-analysis:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php-app

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

  assets:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-app

      - name: Build assets
        run: npm run build

      # Tailwind v4 does not reliably discover classes in Blade or PHP without
      # explicit @source directives. When one is missing the build still
      # succeeds but ships a near-empty stylesheet, so assert on size.
      # The build emits more than one stylesheet (the font imports become
      # their own chunk), so measure the largest — that is the Tailwind
      # bundle whose size proves class discovery worked.
      - name: Assert Tailwind bundle is not empty
        run: |
          if [ -z "$(find public/build/assets -name '*.css' -print -quit)" ]; then
            echo "::error::No CSS emitted by the build"
            exit 1
          fi
          SIZE=$(find public/build/assets -name '*.css' -exec stat -c%s {} + | sort -rn | head -1)
          echo "Largest stylesheet: $SIZE bytes"
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::Tailwind bundle is only $SIZE bytes - a @source directive is probably missing"
            exit 1
          fi
